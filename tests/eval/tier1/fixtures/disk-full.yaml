# ledger-api forwards writes to ledger-store, whose data volume has no free
# space left. As in the connection-pool fixture, no Kubernetes object is broken:
# the volume is declared exactly as intended and both Deployments are healthy.
# The fault is a runtime condition on a filesystem, which no `kubectl get`
# output reports and no object spec contains.
#
# The volume is a memory-backed emptyDir so the tmpfs is created at exactly its
# sizeLimit. Writes then fail with ENOSPC while usage never exceeds the limit,
# which is what keeps kubelet from evicting the pod and keeps every probe green.
apiVersion: v1
kind: Namespace
metadata:
  name: rounds-eval
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-store-app
  namespace: rounds-eval
data:
  fill.py: |
    """Consume the data volume, the way a retention bug or an unrotated log would."""
    import os

    with open("/data/archive.bin", "wb") as archive:
        try:
            while True:
                archive.write(os.urandom(256 * 1024))
                archive.flush()
        except OSError as err:
            print(f"filled the volume: {err}", flush=True)

    usage = os.statvfs("/data")
    print(f"free bytes now {usage.f_bavail * usage.f_frsize}", flush=True)
  app.py: |
    """Append-only ledger. Every write lands on the data volume."""
    import errno
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    LEDGER = "/data/ledger.log"

    lock = threading.Lock()
    writes = {"ok": 0, "no_space": 0}


    def append(record):
        with open(LEDGER, "a") as ledger:
            ledger.write(record)
            ledger.flush()
            os.fsync(ledger.fileno())


    def render():
        usage = os.statvfs("/data")
        with lock:
            counted = dict(writes)
        lines = [
            "# HELP ledger_writes_total Ledger appends by outcome.",
            "# TYPE ledger_writes_total counter",
            *(f'ledger_writes_total{{result="{k}"}} {v}' for k, v in counted.items()),
            "# HELP ledger_data_free_bytes Free space on the ledger data volume.",
            "# TYPE ledger_data_free_bytes gauge",
            f"ledger_data_free_bytes {usage.f_bavail * usage.f_frsize}",
            "# HELP ledger_data_total_bytes Size of the ledger data volume.",
            "# TYPE ledger_data_total_bytes gauge",
            f"ledger_data_total_bytes {usage.f_blocks * usage.f_frsize}",
        ]
        return ("\n".join(lines) + "\n").encode()


    class Handler(BaseHTTPRequestHandler):
        def reply(self, code, body):
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/metrics":
                self.reply(200, render())
                return
            if self.path == "/healthz":
                # Reads nothing and writes nothing, so the pod stays Ready.
                self.reply(200, b"ok\n")
                return
            try:
                append("entry\n")
            except OSError as err:
                if err.errno != errno.ENOSPC:
                    raise
                with lock:
                    writes["no_space"] += 1
                print(f"ledger: append failed: {err}", flush=True)
                self.reply(507, b"ledger write failed\n")
                return
            with lock:
                writes["ok"] += 1
            self.reply(200, b"entry recorded\n")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-app
  namespace: rounds-eval
data:
  app.py: |
    """The tier the caller sees. It owns no storage and forwards every write."""
    import threading
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    STORE = "http://ledger-store:8080/append"

    lock = threading.Lock()
    requests = {"200": 0, "502": 0}


    def render():
        with lock:
            counted = dict(requests)
        return (
            "\n".join(
                [
                    "# HELP api_requests_total Ledger API responses by status code.",
                    "# TYPE api_requests_total counter",
                    *(f'api_requests_total{{code="{k}"}} {v}' for k, v in counted.items()),
                ]
            )
            + "\n"
        ).encode()


    class Handler(BaseHTTPRequestHandler):
        def reply(self, code, body):
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/metrics":
                self.reply(200, render())
                return
            if self.path == "/healthz":
                self.reply(200, b"ok\n")
                return
            try:
                urllib.request.urlopen(STORE, timeout=5).read()
            except urllib.error.HTTPError as err:
                with lock:
                    requests["502"] += 1
                print(f"api: ledger-store refused the write: {err.code}", flush=True)
                self.reply(502, b"could not record the entry\n")
                return
            with lock:
                requests["200"] += 1
            self.reply(200, b"recorded\n")

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-store
  namespace: rounds-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-store
  template:
    metadata:
      labels:
        app: ledger-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      initContainers:
        - name: filler
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/fill.py"]
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /data
      containers:
        - name: store
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              # A memory-backed volume is charged to the container, so this has
              # to leave room for the full 16Mi on top of the interpreter.
              memory: 256Mi
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /data
      volumes:
        - name: app
          configMap:
            name: ledger-store-app
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-store
  namespace: rounds-eval
spec:
  selector:
    app: ledger-store
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: rounds-eval
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: ledger-api-app
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: rounds-eval
spec:
  selector:
    app: ledger-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-load
  namespace: rounds-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-load
  template:
    metadata:
      labels:
        app: ledger-load
    spec:
      containers:
        - name: load
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - while true; do curl -s -o /dev/null -m 5 http://ledger-api:8080/append; sleep 0.2; done
