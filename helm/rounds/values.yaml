replicaCount: 1

image:
  repository: ghcr.io/syntropize-ai/rounds
  # Empty defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rounds.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  # Used only when secretEnv.DATABASE_URL is empty. For production Kubernetes,
  # prefer external Postgres and keep this PVC for temporary/local state only.
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  mountPath: /var/lib/rounds

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Plain (non-secret) environment. Every key here is read by the server —
# see docs/configuration.md. Anything else belongs under `env.extra`.
env:
  NODE_ENV: production
  PORT: "3000"
  DATA_DIR: /var/lib/rounds
  LOG_LEVEL: info
  CORS_ORIGINS: ""
  DATABASE_POOL_SIZE: "10"
  DATABASE_SSL: "false"
  # Rounds blocks private/loopback/link-local targets unless this is "true".
  # In-cluster datasources (e.g. http://prometheus.monitoring:9090) resolve
  # to RFC1918 addresses; the helm chart targets self-hosted operators, so it
  # opts out here. Set to "false" for multi-tenant / public deploys.
  OPENOBS_ALLOW_PRIVATE_URLS: "true"
  extra: {}

secretEnv:
  # Empty strings trigger the chart to auto-generate on first install
  # and preserve on upgrade (see templates/secret.yaml lookup logic).
  # Operators who want to pin explicit values can set them here or
  # point to an existing Kubernetes Secret via `existingSecret`.
  JWT_SECRET: ""
  SECRET_KEY: ""
  API_KEYS: ""
  # Set before first startup to use the full Postgres repository backend.
  # Leave empty for local SQLite on the persistence PVC.
  DATABASE_URL: ""
  REDIS_URL: ""
  # Read only by the setup wizard's "Test connection" probe. The provider,
  # model, and key you save in the wizard are stored encrypted in the database.
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  # Seeds the first admin while the user table is still empty. Both are
  # required for seeding to happen.
  SEED_ADMIN_EMAIL: ""
  SEED_ADMIN_PASSWORD: ""

existingSecret: ""

# Bootstrap ServiceAccount + RBAC for `ops.cluster_shell` plan steps.
# When enabled, the api-gateway can run agent-proposed shell scripts
# (`helm install`, `istioctl install`, `curl | sh`) as one-shot Jobs in
# the cluster. Each Job is gated by the connector policy table — nothing
# runs until an operator approves the plan in the UI.
clusterShell:
  enabled: true
  serviceAccount: rounds-bootstrap
  # Where the SA + Jobs live. The chart creates this namespace when enabled.
  namespace: rounds-system
  # ClusterRole bound to the SA. Defaults to `cluster-admin` so
  # installing any chart / CRD / operator works without per-install RBAC
  # tweaks. Set to "" to skip the binding (attach a tighter role
  # yourself), or to the name of a ClusterRole you've defined elsewhere.
  clusterRole: cluster-admin
  # Image used as the runner container. Defaults to alpine/k8s:1.29.0
  # (kubectl + curl + sh + jq baked in). Leave empty to use the adapter
  # default.
  image: ""
