apiVersion: v1
kind: Namespace
metadata:
  name: humio
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: humio-data
  namespace: humio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: humio
  namespace: humio
  labels:
    app: humio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: humio
  template:
    metadata:
      labels:
        app: humio
    spec:
      containers:
        - name: humio
          image: humio/humio-single-node-demo:1.237.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTHENTICATION_METHOD
              value: single-user
            - name: SINGLE_USER_USERNAME
              value: admin
            - name: SINGLE_USER_PASSWORD
              value: local-dev-root-token-2026
            - name: ELASTIC_PORT
              value: "9200"
            - name: PUBLIC_URL
              value: http://humio.humio.svc.cluster.local:8080
            - name: KAFKA_SERVERS
              value: 127.0.0.1:9092
            - name: HUMIO_PORT
              value: "8080"
            - name: HUMIO_HTTP_BIND
              value: 0.0.0.0
            - name: ENABLE_BEARER_TOKEN_AUTHORIZATION
              value: "true"
            - name: BOOTSTRAP_ROOT_TOKEN_HASHED
              value: P2HS9.20.JJ3yAE66R4swc4A4mw9AuL1XFjEfa/5KPxWNM+gzl/iDOQvCbsd1JFs3jwtHc2o99TbSvXiRKTe6n7/XmplLtg
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          volumeMounts:
            - name: humio-data
              mountPath: /data
      volumes:
        - name: humio-data
          persistentVolumeClaim:
            claimName: humio-data
---
apiVersion: v1
kind: Service
metadata:
  name: humio
  namespace: humio
  labels:
    app: humio
spec:
  selector:
    app: humio
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: humio-bookstore-fluent-bit
  namespace: humio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: humio-bookstore-fluent-bit
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: humio-bookstore-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: humio-bookstore-fluent-bit
subjects:
  - kind: ServiceAccount
    name: humio-bookstore-fluent-bit
    namespace: humio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: humio-bookstore-fluent-bit
  namespace: humio
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_default_*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     128MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Labels              On
        Annotations         Off

    [FILTER]
        Name          rewrite_tag
        Match         kube.*
        Rule          $kubernetes['labels']['app'] ^(productpage|details|ratings|reviews)$ humio.bookstore true
        Emitter_Name  bookstore_rewrite

    [OUTPUT]
        Name              es
        Match             humio.bookstore
        Host              humio.humio.svc.cluster.local
        Port              8080
        HTTP_User         bookstore
        HTTP_Passwd       ${HUMIO_INGEST_TOKEN}
        Logstash_Format   On
        Replace_Dots      On
        Time_Key          @timestamp
        Retry_Limit       False
        Buffer_Size       5MB

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<flags>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: humio-bookstore-fluent-bit
  namespace: humio
  labels:
    app: humio-bookstore-fluent-bit
spec:
  selector:
    matchLabels:
      app: humio-bookstore-fluent-bit
  template:
    metadata:
      labels:
        app: humio-bookstore-fluent-bit
    spec:
      serviceAccountName: humio-bookstore-fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.10
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf
          env:
            - name: HUMIO_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: humio-bookstore-ingest
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: humio-bookstore-fluent-bit
        - name: var-log
          hostPath:
            path: /var/log
