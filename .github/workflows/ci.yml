name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Globs "packages/*/src/**/*.{ts,tsx}". The .tsx half matters: packages/web
      # is ~130 .tsx files that a *.ts-only glob silently skipped. --max-warnings
      # pins today's warning count so the total can only ratchet down.
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs "tsc --build", which walks the project references in tsconfig.json.
      # Do not switch this back to "tsc --noEmit -p tsconfig.json": that config is
      # a solution file with "files": [], so it has zero direct inputs and the job
      # passed in ~0.3s without type-checking a single package.
      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workspace packages (e.g. @agentic-obs/common) have "exports" pointing
      # at ./dist/*.js, so vitest's resolver needs the compiled output to exist
      # before tests run. Without this build step, every test that imports a
      # workspace package fails with "Failed to resolve entry for package".
      - run: npm run build
      # vitest needs a coverage provider; install ad-hoc to avoid touching package-lock
      - run: npm install --no-save @vitest/coverage-v8@^3.2.0
      - run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          # CODECOV_TOKEN is optional for public repos but recommended.
          # Add at: Settings → Secrets and variables → Actions → CODECOV_TOKEN
          token: ${{ secrets.CODECOV_TOKEN }}
